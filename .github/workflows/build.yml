name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build.sh build-dmg.sh
          ./build.sh
          CI=1 ./build-dmg.sh "0.0.0-${GITHUB_SHA::7}"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: BetterDiscord-Mac-Installer
          path: dist/*.dmg
          if-no-files-found: error
