name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build.sh build-dmg.sh
          VERSION="${{ inputs.version }}"
          ./build.sh
          CI=1 ./build-dmg.sh "$VERSION"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/BetterDiscord Installer.app" \
            "dist/BetterDiscord-Mac-Installer-${VERSION}.zip"
          shasum -a 256 \
            "dist/BetterDiscord-Mac-Installer-${VERSION}.dmg" \
            "dist/BetterDiscord-Mac-Installer-${VERSION}.zip" \
            > dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: BetterDiscord Installer ${{ inputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
