name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (for example 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build app and DMG
        run: |
          chmod +x build.sh build-dmg.sh
          ./build.sh
          CI=1 ./build-dmg.sh "${{ inputs.version }}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: BetterDiscord Installer ${{ inputs.version }}
          files: dist/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
